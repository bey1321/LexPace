<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LexPace Reading Journey (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles/lexpace-games.css">
<style>body { background: var(--lx-bg); margin: 0; }</style>

<div id="journey"></div>

<script type="module">
  import { createJourney } from "./src/lexpace-games.js";

  createJourney(document.getElementById("journey"), {
    model: "model/lexpace_model.json", // trained on synthetic data; remove for rules only
    teamView: true,                    // false in production: students only see their own message
    onEvent: (e) => console.debug("[lexpace]", e.type, e),
    onComplete: (payload) => console.info("[lexpace] features", payload.features),
    onShare: (payload) => console.info("[lexpace] share with SAS", payload.sessionId),
  });
</script>

</body></html>
