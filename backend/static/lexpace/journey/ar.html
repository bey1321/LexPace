<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LexPace | رحلة القراءة العربية</title><style>
:root{--bg:#f6f8fc;--ink:#17263d;--muted:#63738a;--line:#e0e7f0;--blue:#3769c9;--pale:#eaf1ff;--white:#fff;--green:#157a62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}.shell{max-width:1050px;margin:0 auto;padding:28px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:34px}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--blue)}.tag{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px}.layout{display:grid;grid-template-columns:230px 1fr;gap:22px}.side,.panel{background:#fff;border:1px solid var(--line);border-radius:20px}.side{padding:18px;height:max-content}.side h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:4px 8px 16px}.step{padding:11px 12px;border-radius:11px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;margin:4px 0}.step.active{background:var(--pale);color:#234e9b;font-weight:700}.step.done{color:var(--green)}.step b{width:23px;height:23px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px;flex:none}.panel{min-height:530px;padding:36px 42px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800}.panel h1{font-size:31px;letter-spacing:-1.2px;line-height:1.2;margin:12px 0}.muted{color:var(--muted)}.lead{max-width:560px;font-size:16px}.btn{border:0;border-radius:11px;padding:13px 19px;font-weight:700;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#eef2f9;color:#264a84}.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:25px}.field{margin:18px 0}.field label{font-weight:650;display:block;margin-bottom:8px;font-size:14px}.field select,.field input,.field textarea{width:100%;border:1px solid #cfd9e8;border-radius:10px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff}.choices{display:grid;gap:11px;margin:22px 0}.choice{width:100%;text-align:left;padding:15px 18px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-size:15px;cursor:pointer;transition:.15s}.choice:hover{border-color:#9cb8ed;background:#f8faff}.choice.selected{border:2px solid var(--blue);background:#edf3ff;padding:14px 17px}.stimulus{background:#f4f7fc;border:1px solid #e3eaf4;border-radius:17px;padding:35px 18px;text-align:center;font-size:37px;font-weight:650;letter-spacing:1px;margin:26px 0}.small{font-size:12px}.progress{height:7px;background:#e8edf6;border-radius:99px;overflow:hidden;margin:15px 0 27px}.bar{height:100%;background:var(--blue);transition:width .25s}.info{background:#f1f6ff;border:1px solid #dbe8fc;padding:15px;border-radius:12px;font-size:13px;color:#345079}.pill{display:inline-block;border-radius:99px;background:#edf2fb;color:#4d6382;font-size:12px;padding:6px 11px;margin:5px 4px 0 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.metric{border:1px solid var(--line);padding:16px;border-radius:12px}.metric strong{display:block;font-size:25px}.metric span{font-size:12px;color:var(--muted)}.passage{max-height:275px;overflow:auto;background:#f8fafd;border:1px solid var(--line);border-radius:13px;padding:20px;font-size:17px;line-height:1.9}.audio{background:#f2f6fd;border-radius:14px;padding:25px;text-align:center;margin:24px 0}.audio button{margin-top:8px}.toggle{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:14px}.toggle input{width:18px;height:18px}.foot{color:#7a8799;font-size:12px;margin-top:25px}.hidden{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{display:none}.panel{padding:24px 20px;min-height:510px}.shell{padding:16px}.panel h1{font-size:26px}.metrics{grid-template-columns:1fr 1fr}.top{margin-bottom:18px}}

body{font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif;direction:rtl} .brand{letter-spacing:0}.panel h1{letter-spacing:0}.eyebrow{letter-spacing:0}.side h3{letter-spacing:0;text-transform:none}.choice{text-align:right}.step{direction:rtl}.stimulus{letter-spacing:0}.passage{line-height:2.1}.top{direction:rtl} .field input{text-align:right} .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="ltr">Lex<span>Pace</span></span> <span style="font-weight:400;color:#8492a7">/ رحلة القراءة</span></div><div class="tag">نموذج تجريبي · ليس تشخيصًا</div></header><main class="layout"><aside class="side"><h3>مراحل الرحلة</h3><div id="nav"></div></aside><section class="panel" id="app"></section></main><p class="foot">نموذج تفاعلي لأغراض التصميم فقط، وليس أداة فحص معتمدة. يعتمد تشغيل الصوت على الأصوات العربية المتاحة في المتصفح. تُرسل إجاباتك إلى خادم LexPace لاختيار السؤال التالي وتقييم الإجابات.</p></div><script src="journey-api.js"></script><script>const stages=['الترحيب','قبل البدء','كلمة أم لا؟','مختبر الأصوات','اسمع واكتب','التعبير الكتابي','اقرأ واستمع','تحدي الأعداد','التفكير الرياضي','تاريخ التعلّم','الملخص'];
let stage=0,trial=0,selected=null,started=0,results=[],context={},historyAnswers={},historyCodes={},passageStart=0,passageDone=false,lookbacks=0,phase=0,audioPlays=0;
// LexPace integration: items and scoring come from the backend (see journey-api.js)
LP.text={loading:'جارٍ تجهيز السؤال التالي…',error:'تعذّر الاتصال بـ LexPace. تحقّق من الاتصال ثم حاول مرة أخرى.',retry:'حاول مرة أخرى'};const LEVELS=['','سهل','متوسط','صعب'];const cur=a=>LP.cache[a+':'+trial];const elapsed=()=>Math.round(performance.now()-started);
const app=document.getElementById('app'),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const history=[['reading','هل واجهت صعوبة في تعلم القراءة خلال المرحلة الابتدائية؟'],['spelling','هل واجهت صعوبة في تعلم الإملاء أو الكتابة في طفولتك؟'],['math','هل واجهت صعوبة في تعلم الأعداد أو العمليات الحسابية الأساسية؟'],['support','إلى أي مدى احتجت إلى مساعدة دراسية إضافية في المدرسة؟'],['persistent','هل ما زالت القراءة أو الكتابة أو الرياضيات تتطلب منك جهدًا أكبر من المعتاد؟']];
let passage='',passageQuestions=[];
function nav(){$('nav').innerHTML=stages.map((s,i)=>`<div class="step ${i===stage?'active':i<stage?'done':''}"><b>${i<stage?'✓':i+1}</b>${esc(s)}</div>`).join('')}
function show(h){app.innerHTML=h;nav()}
function go(n){stopMathClock();stage=n;trial=0;selected=null;phase=0;render()}
function record(game,item,answer,correct,extra={}){results.push({game,item,answer,correct,latency_ms:Math.round(performance.now()-started),...extra})}
function timer(){started=performance.now()}
function heading(k,t,d){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted lead">${d}</p>`}
function progress(n,total){return `<div class="small muted">السؤال ${n} من ${total}</div><div class="progress"><div class="bar" style="width:${100*(n-1)/total}%"></div></div>`}
function options(a){return `<div class="choices">${a.map((v,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="choose(${i})">${esc(v)}</button>`).join('')}</div>`}
function choose(i){selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',i===j));if($('continue'))$('continue').disabled=false}
function speak(t){if(!('speechSynthesis' in window)){alert('تشغيل الصوت غير متاح في هذا المتصفح.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.75;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ar'));if(v)u.voice=v;audioPlays++;speechSynthesis.speak(u)}
function render(){if(stage===0){show(heading('رحلة تعلّم هادئة','مرحبًا بك في رحلة القراءة','أنشطة قصيرة للتعرّف إلى الكلمات والأصوات والإملاء وفهم النصوص. لا توجد درجات نجاح أو رسوب.')+`<div class="info">هذا نموذج تجريبي لتصميم التجربة، وليس اختبارًا معتمدًا للكشف عن عسر القراءة أو تشخيصه.</div><div class="actions"><button class="btn" onclick="go(1)">ابدأ الرحلة ←</button></div>`)}
else if(stage===1){show(heading('الخطوة ١ · التهيئة','قبل أن تبدأ','هذه المعلومات تساعدنا على فهم تجربتك اللغوية، ولا تدخل في درجة الاختبار.')+`<div class="field"><label for="first">ما لغتك الأولى؟</label><select id="first"><option value="">اختر...</option><option>العربية</option><option>الإنجليزية</option><option>الأمهرية</option><option>الأوردية</option><option>الهندية</option><option>لغة أخرى</option></select></div><div class="field"><label for="years">كم سنة درست باللغة العربية؟</label><select id="years"><option value="">اختر...</option><option>أقل من ٣ سنوات</option><option>٣–٦ سنوات</option><option>٧–١٠ سنوات</option><option>أكثر من ١٠ سنوات</option></select></div><div class="field"><label for="comfort">ما مدى راحتك في القراءة باللغة العربية؟</label><select id="comfort"><option>مرتاح جدًا</option><option>مرتاح إلى حد ما</option><option>غير مرتاح</option></select></div><label class="toggle"><input type="checkbox" id="hear"> أستطيع سماع الصوت بوضوح</label><div class="actions"><button class="btn" onclick="context={firstLanguage:$('first').value,arabicStudyYears:$('years').value,arabicComfort:$('comfort').value,hearing:$('hear').checked,assessmentLanguage:'ar'};LP.start('ar',context).then(()=>go(2),e=>LP.fail(e))">متابعة ←</button></div>`)}
else if(stage===2){const t=LP.step('lexical',trial,3);if(!t)return;show(heading('المحطة ١ · الكلمات','كلمة أم لا؟','هل هذه كلمة عربية حقيقية أم كلمة مبتكرة؟ خذ وقتك في الإجابة.')+progress(trial+1,LP.total('lexical'))+`<span class="pill">${LEVELS[t.difficulty]}</span><div class="stimulus">${esc(t.stimulus)}</div>`+options(['كلمة حقيقية','كلمة مبتكرة'])+`<button id="continue" class="btn" disabled onclick="submitWord()">التالي ←</button>`);timer()}
else if(stage===3){const t=LP.step('sound',trial,4);if(!t)return;show(heading('المحطة ٢ · الأصوات','مختبر الأصوات','استمع إلى الكلمة، ثم احذف الصوت المكتوب واختر الإجابة المسموعة.')+progress(trial+1,LP.total('sound'))+`<span class="pill">${LEVELS[t.difficulty]}</span><div class="audio"><button class="btn secondary" onclick="speak('${t.word}')">▶ استمع إلى الكلمة</button></div><div class="stimulus" style="font-size:26px">احذف الصوت <strong>/${esc(t.remove||'ب')}/</strong></div><div class="choices">${t.options.map((v,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="choose(${i});speak('${v}')">▶ الإجابة ${i+1}</button>`).join('')}</div><button id="continue" class="btn" disabled onclick="submitSound()">التالي ←</button><p class="foot">الكلمة والإجابات صوتية فقط. قد يختلف نطق الأصوات عبر توليد الكلام آليًا؛ يُنصح بالتسجيلات البشرية.</p>`);timer()}
else if(stage===4){const t=LP.step('spelling',trial,5);if(!t)return;show(heading('المحطة ٣ · الإملاء','اسمع واكتب','استمع إلى الكلمة ثم اكتبها. يمكنك إعادة تشغيل الصوت.')+progress(trial+1,LP.total('spelling'))+`<span class="pill">${LEVELS[t.difficulty]}</span><div class="audio"><button class="btn secondary" onclick="speak('${t.spoken}')">▶ استمع</button></div><div class="field"><label for="spelling">اكتب الكلمة هنا</label><input id="spelling" dir="rtl" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="إجابتك" onkeydown="if(event.key==='Enter')submitSpelling()"></div><button class="btn" onclick="submitSpelling()">التالي ←</button>`);timer()}
else if(stage===5){const t=LP.step('writing',0,6);if(!t)return;show(heading('المحطة ٤ · الكتابة','عبّر عن فكرتك','اكتب فقرة قصيرة بأسلوبك. يتيح النشاط ملاحظة القواعد وعلامات الترقيم وترتيب الأفكار ووضوحها.')+`<div class="field"><label for="writing">${esc(t.prompt)}</label><textarea id="writing" rows="6" maxlength="1500" placeholder="اكتب إجابتك هنا..." spellcheck="false" dir="rtl" style="width:100%;padding:14px;border:1px solid #d8e1ef;border-radius:12px;font:inherit;resize:vertical"></textarea></div><button class="btn" onclick="submitWriting()">متابعة ←</button><p class="foot">تُحفظ كتابتك وتُقيَّم من حيث القواعد وعلامات الترقيم وتنظيم الأفكار ووضوحها.</p>`);timer()}
else if(stage===6){renderPassage()}
else if(stage===7){renderMathNumber()}
else if(stage===8){renderMathReasoning()}
else if(stage===9){const q=history[trial];if(!q){go(10);return}show(heading('الخطوة الأخيرة · التاريخ الدراسي','تجربتك مع التعلّم','أسئلة اختيارية عن خبراتك السابقة. يمكنك اختيار «لا أتذكر».')+progress(trial+1,history.length)+`<h2 style="font-size:19px;margin-top:25px">${esc(q[1])}</h2>`+options(['لا توجد صعوبة','صعوبة بسيطة','صعوبة متوسطة','صعوبة كبيرة','لا أتذكر / أفضل عدم الإجابة'])+`<button id="continue" class="btn" disabled onclick="submitHistory()">التالي ←</button>`)}
else if(stage===10){if(!LP.finish(historyCodes,{passage_reading_ms:context.passageReadingMs??null}))return;const names=['كلمة أم لا؟','مختبر الأصوات','اسمع واكتب','التعبير الكتابي','اقرأ واستمع','تحدي الأعداد','التفكير الرياضي'];const byGame=names.map(g=>{const a=results.filter(r=>r.game===g&&r.correct!==null);return {g,ok:a.filter(x=>x.correct).length,n:a.length}});show(heading('اكتملت الرحلة','ملخص أنشطتك','هذه النتائج توضح الأنشطة التي أكملتها، ولا تحدد وجود صعوبة تعلّم.')+`<div class="metrics"><div class="metric"><strong>${results.length}</strong><span>استجابة مسجلة</span></div><div class="metric"><strong>${Object.keys(historyAnswers).length}</strong><span>إجابة تاريخ دراسي</span></div><div class="metric"><strong>٧</strong><span>محطات</span></div></div><div class="choices">${byGame.map(x=>`<div class="choice" style="cursor:default"><strong>${x.g}</strong><span style="float:left;color:#63738a">${x.n?x.ok+' / '+x.n:'مكتمل'}</span></div>`).join('')}</div>${resultBox()}<div class="actions"><button class="btn" onclick="download()">تصدير بيانات الجلسة JSON ↓</button><button class="btn ghost" onclick="reset()">البدء من جديد</button></div>`)} }
// LexPace integration: answers are evaluated on the server; the next item adapts to them
async function submitWord(){const t=cur('lexical'),ms=elapsed(),r=await LP.answer(t,{response:selected,latency_ms:ms});if(!r)return;record('كلمة أم لا؟',t.stimulus,selected===0?'حقيقية':'مبتكرة',r.correct,{level:LEVELS[t.difficulty],latency_ms:ms});trial++;selected=null;render()}
async function submitSound(){const t=cur('sound'),ms=elapsed(),r=await LP.answer(t,{response:selected,latency_ms:ms,audio_plays:audioPlays});if(!r)return;record('مختبر الأصوات',t.word,t.options[selected],r.correct,{level:LEVELS[t.difficulty],audioPlays,latency_ms:ms});audioPlays=0;trial++;selected=null;render()}
async function submitSpelling(){const t=cur('spelling'),v=$('spelling').value.trim();if(!v)return;const ms=elapsed(),r=await LP.answer(t,{response:v,latency_ms:ms,audio_plays:audioPlays});if(!r)return;record('اسمع واكتب',t.spoken,v,r.correct,{level:LEVELS[t.difficulty],audioPlays,latency_ms:ms});audioPlays=0;trial++;render()}
async function submitWriting(){const v=$('writing').value.trim();if(!v){alert('يرجى كتابة إجابة قصيرة.');return}const t=cur('writing')||LP.cache['writing:0'],ms=elapsed(),r=await LP.answer(t,{response:v,latency_ms:ms});if(!r)return;record('التعبير الكتابي','فقرة عن مساحة الدراسة',v,null,{characters:v.length,words:v.split(/\s+/).length,latency_ms:ms});go(6)}
function resultBox(){const c=(LP.final||{}).classification||{};if(c.status!=='ok')return `<div class="info">${c.status==='model_not_connected'?'حُفظت إجاباتك. ستظهر نتائج الفحص هنا بعد ربط نموذج الفحص المُدرَّب.':'حُفظت إجاباتك، لكن تعذّر حساب النتائج الآن.'}</div>`;const names={reading:'دعم القراءة',writing:'دعم الكتابة',math:'دعم الحساب'};return `<div class="info">${Object.keys(names).map(k=>`<div><strong>${names[k]}:</strong> ${c.outputs&&c.outputs[k]&&c.outputs[k].positive?'مقترح':'غير مطلوب'}</div>`).join('')}<div class="small" style="margin-top:8px">هذا فحص أولي وليس تشخيصًا.</div></div>`}
function renderPassage(){const P=LP.step('comprehension',0,7);if(!P)return;passage=P.passage;passageQuestions=P.questions.map(q=>({q:q.question,opts:q.options}));if(!passageDone){show(heading('المحطة ٥ · الفهم','اقرأ واستمع','اقرأ النص بالسرعة المريحة لك، ثم أجب عن الأسئلة.')+`<div class="passage">${esc(passage)}</div><div class="actions"><button class="btn" onclick="passageDone=true;context.passageReadingMs=Math.round(performance.now()-passageStart);trial=0;render()">انتهيت من القراءة ←</button></div>`);if(!passageStart)passageStart=performance.now();return}const t=passageQuestions[trial];if(!t){go(7);return}show(heading('المحطة ٥ · الفهم','أسئلة النص','اختر الإجابة بناءً على ما قرأته.')+progress(trial+1,passageQuestions.length)+`<h2 style="font-size:19px">${esc(t.q)}</h2>`+options(t.opts)+`<div class="actions"><button class="btn secondary" onclick="lookbacks++;alert(passage)">العودة إلى النص</button><button id="continue" class="btn" disabled onclick="submitPassage()">التالي ←</button></div>`);timer()}
async function submitPassage(){const t=passageQuestions[trial],ms=elapsed(),r=await LP.answer(LP.cache['comprehension:0'],{response:selected,question_index:trial,latency_ms:ms,lookbacks});if(!r)return;record('اقرأ واستمع',t.q,t.opts[selected],r.correct,{lookbacks,latency_ms:ms});trial++;selected=null;render()}
function submitHistory(){const q=history[trial];historyCodes[q[0]]=selected<4?selected:null;historyAnswers[q[0]]=['لا توجد صعوبة','صعوبة بسيطة','صعوبة متوسطة','صعوبة كبيرة','لا أتذكر / أفضل عدم الإجابة'][selected];trial++;selected=null;render()}
let mathClock=null,mathDeadline=0,mathLocked=false;
function stopMathClock(){if(mathClock!==null){clearInterval(mathClock);mathClock=null}}
function mathLimit(t,reasoning){return reasoning?40:(t.skill==='number_sense'?8:t.skill==='number_fact'?10:25)}
function beginMathClock(seconds,submit){stopMathClock();mathLocked=false;mathDeadline=performance.now()+seconds*1000;const update=()=>{const remaining=Math.max(0,Math.ceil((mathDeadline-performance.now())/1000));const el=$('math-clock');if(el)el.textContent=remaining;if(remaining===0){stopMathClock();if(!mathLocked)submit(true)}};update();mathClock=setInterval(update,100)}
function mathSelect(i,reasoning){if(mathLocked)return;selected=i;if(reasoning)submitMathReasoning(false);else submitMathNumber(false)}
function renderMathNumber(){const t=LP.step('number',trial,8);if(!t)return;const limit=t.time_limit_s||mathLimit(t,false);show(heading('المحطة ٦ · الرياضيات','تحدي الأعداد','اختر الإجابة قبل انتهاء الوقت. تبدأ الأسئلة من لحظة ظهورها.')+progress(trial+1,LP.total('number'))+`<div class="pill">الوقت المتبقي: <strong id="math-clock">${limit}</strong> ثانية</div><h2>${esc(t.question)}</h2><div class="choices">${t.options.map((v,i)=>`<button class="choice" onclick="mathSelect(${i},false)">${esc(v)}</button>`).join('')}</div><p class="foot">تُحفظ الإجابة فور اختيارها، ويُسجّل انتهاء الوقت بشكل منفصل.</p>`);timer();beginMathClock(limit,submitMathNumber)}
async function submitMathNumber(timeout=false){if(mathLocked)return;mathLocked=true;stopMathClock();const t=cur('number'),ms=elapsed(),r=await LP.answer(t,{response:timeout?null:selected,latency_ms:ms,timeout});if(!r)return;record('تحدي الأعداد',t.question,timeout?null:t.options[selected],r.correct,{skill:t.skill,timeout:r.timeout,time_limit_s:t.time_limit_s,latency_ms:ms});trial++;selected=null;render()}
function renderMathReasoning(){const t=LP.step('reasoning',trial,9);if(!t)return;const limit=t.time_limit_s||mathLimit(t,true);show(heading('المحطة ٧ · الرياضيات','التفكير الرياضي','اختر الإجابة قبل انتهاء الوقت.')+progress(trial+1,LP.total('reasoning'))+`<div class="pill">الوقت المتبقي: <strong id="math-clock">${limit}</strong> ثانية</div><h2>${esc(t.question)}</h2><div class="choices">${t.options.map((v,i)=>`<button class="choice" onclick="mathSelect(${i},true)">${esc(v)}</button>`).join('')}</div><p class="foot">تُحفظ الإجابة فور اختيارها، ويُسجّل انتهاء الوقت بشكل منفصل.</p>`);timer();beginMathClock(limit,submitMathReasoning)}
async function submitMathReasoning(timeout=false){if(mathLocked)return;mathLocked=true;stopMathClock();const t=cur('reasoning'),ms=elapsed(),r=await LP.answer(t,{response:timeout?null:selected,latency_ms:ms,timeout});if(!r)return;record('التفكير الرياضي',t.question,timeout?null:t.options[selected],r.correct,{timeout:r.timeout,time_limit_s:t.time_limit_s,latency_ms:ms});trial++;selected=null;render()}
function download(){const payload={prototype:true,assessmentLanguage:'ar',created_at:new Date().toISOString(),context,historyAnswers,results,screening:LP.final};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lexpace_arabic_demo_session.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reset(){stage=0;trial=0;selected=null;results=[];context={};historyAnswers={};historyCodes={};passageStart=0;passageDone=false;lookbacks=0;phase=0;audioPlays=0;render()}
render();</script></body></html>
