<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LexPace | Reading Journey</title>
<style>
:root{--bg:#f6f8fc;--ink:#17263d;--muted:#63738a;--line:#e0e7f0;--blue:#3769c9;--pale:#eaf1ff;--white:#fff;--green:#157a62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}.shell{max-width:1050px;margin:0 auto;padding:28px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:34px}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--blue)}.tag{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 12px}.layout{display:grid;grid-template-columns:230px 1fr;gap:22px}.side,.panel{background:#fff;border:1px solid var(--line);border-radius:20px}.side{padding:18px;height:max-content}.side h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:4px 8px 16px}.step{padding:11px 12px;border-radius:11px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;margin:4px 0}.step.active{background:var(--pale);color:#234e9b;font-weight:700}.step.done{color:var(--green)}.step b{width:23px;height:23px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px;flex:none}.panel{min-height:530px;padding:36px 42px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800}.panel h1{font-size:31px;letter-spacing:-1.2px;line-height:1.2;margin:12px 0}.muted{color:var(--muted)}.lead{max-width:560px;font-size:16px}.btn{border:0;border-radius:11px;padding:13px 19px;font-weight:700;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#eef2f9;color:#264a84}.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:25px}.field{margin:18px 0}.field label{font-weight:650;display:block;margin-bottom:8px;font-size:14px}.field select,.field input,.field textarea{width:100%;border:1px solid #cfd9e8;border-radius:10px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff}.choices{display:grid;gap:11px;margin:22px 0}.choice{width:100%;text-align:left;padding:15px 18px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-size:15px;cursor:pointer;transition:.15s}.choice:hover{border-color:#9cb8ed;background:#f8faff}.choice.selected{border:2px solid var(--blue);background:#edf3ff;padding:14px 17px}.stimulus{background:#f4f7fc;border:1px solid #e3eaf4;border-radius:17px;padding:35px 18px;text-align:center;font-size:37px;font-weight:650;letter-spacing:1px;margin:26px 0}.small{font-size:12px}.progress{height:7px;background:#e8edf6;border-radius:99px;overflow:hidden;margin:15px 0 27px}.bar{height:100%;background:var(--blue);transition:width .25s}.info{background:#f1f6ff;border:1px solid #dbe8fc;padding:15px;border-radius:12px;font-size:13px;color:#345079}.pill{display:inline-block;border-radius:99px;background:#edf2fb;color:#4d6382;font-size:12px;padding:6px 11px;margin:5px 4px 0 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.metric{border:1px solid var(--line);padding:16px;border-radius:12px}.metric strong{display:block;font-size:25px}.metric span{font-size:12px;color:var(--muted)}.passage{max-height:275px;overflow:auto;background:#f8fafd;border:1px solid var(--line);border-radius:13px;padding:20px;font-size:17px;line-height:1.9}.audio{background:#f2f6fd;border-radius:14px;padding:25px;text-align:center;margin:24px 0}.audio button{margin-top:8px}.toggle{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:14px}.toggle input{width:18px;height:18px}.foot{color:#7a8799;font-size:12px;margin-top:25px}.hidden{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{display:none}.panel{padding:24px 20px;min-height:510px}.shell{padding:16px}.panel h1{font-size:26px}.metrics{grid-template-columns:1fr 1fr}.top{margin-bottom:18px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand">Lex<span>Pace</span><span style="font-weight:400;color:#8492a7"> / Reading Journey</span></div><div class="tag">Prototype · Not a diagnosis</div></header><main class="layout"><aside class="side"><h3>Your journey</h3><div id="nav"></div></aside><section class="panel" id="app"></section></main><p class="foot">LexPace prototype. Tasks are illustrative and not validated for learning-disability screening. Audio uses browser speech synthesis where supported. Results remain in this browser session unless exported.</p></div>
<script>
const stages=['Welcome','Before you start','Real or Not?','Sound Lab','Echo','Express Your Idea','Read & Listen','Number Challenge','Math Reasoning','Learning history','Summary'];let stage=0,trial=0,selected=null,started=0,results=[],context={},historyAnswers={},passageStart=0,passageDone=false,lookbacks=0,phase=0;const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wordTrials=[{word:'marn',options:['Real word','Made-up word'],answer:1,level:'Easy'},{word:'garden',options:['Real word','Made-up word'],answer:0,level:'Easy'},{word:'brone',options:['Real word','Made-up word'],answer:1,level:'Medium'},{word:'cautious',options:['Real word','Made-up word'],answer:0,level:'Medium'},{word:'intermittent',options:['Real word','Made-up word'],answer:0,level:'Hard'},{word:'transplication',options:['Real word','Made-up word'],answer:1,level:'Hard'}];
const soundTrials=[{word:'mip',remove:'m',options:['ip','mi','pi'],answer:0,level:'Easy'},{word:'sog',remove:'g',options:['og','so','sg'],answer:1,level:'Medium'},{word:'plim',remove:'l',options:['pim','lim','plm'],answer:0,level:'Hard'}];
const spellingTrials=[{word:'island',level:'Easy'},{word:'receipt',level:'Medium'},{word:'rhythm',level:'Hard'}];
const mathHistory=[['reading','When you were in elementary school, how difficult was learning to read?'],['spelling','How difficult was learning to spell when you were younger?'],['math','Did you have difficulty learning basic number concepts or arithmetic?'],['support','How much extra academic help did you need during school?'],['persistent','Do reading, writing, or math tasks still require unusually high effort for you?']];
function nav(){ $('nav').innerHTML=stages.map((s,i)=>`<div class="step ${i===stage?'active':i<stage?'done':''}"><b>${i<stage?'✓':i+1}</b>${esc(s)}</div>`).join('')}
function show(html){app.innerHTML=html;nav()}
function go(n){stopMathClock();stage=n;trial=0;selected=null;phase=0;render()}
function record(game,item,answer,correct,extra={}){results.push({game,item,answer,correct,latency_ms:Math.round(performance.now()-started),...extra})}
function startTimer(){started=performance.now()}
function heading(label,title,description){return `<div class="eyebrow">${label}</div><h1>${title}</h1><p class="muted lead">${description}</p>`}
function progress(n,total){return `<div class="small muted">Challenge ${n} of ${total}</div><div class="progress"><div class="bar" style="width:${100*(n-1)/total}%"></div></div>`}
function options(arr){return `<div class="choices">${arr.map((v,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="choose(${i})">${esc(v)}</button>`).join('')}</div>`}
function choose(i){selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',i===j));let btn=$('continue');if(btn)btn.disabled=false}
function speak(text){if(!('speechSynthesis' in window)){alert('Speech playback is unavailable in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
function render(){if(stage===0){show(heading('A calmer way to explore learning','Welcome to your Reading Journey','A series of short interactive challenges about words, sounds, spelling and understanding. There are no grades or pass/fail labels.')+`<div class="info">This is a demonstration, not a validated dyslexia test. Your responses are used only to show how the experience could work.</div><div class="actions"><button class="btn" onclick="go(1)">Start journey →</button></div>`)}
else if(stage===1){show(heading('Step 01 · Setup','Before you start','A few details help us interpret the activities fairly.')+`<div class="field"><label for="language">First language</label><select id="language"><option value="">Select...</option><option>Arabic</option><option>English</option><option>Amharic</option><option>Hindi</option><option>Urdu</option><option>Other</option></select></div><div class="field"><label for="years">Years studying in English</label><select id="years"><option value="">Select...</option><option>Less than 3</option><option>3–6</option><option>7–10</option><option>More than 10</option></select></div><label class="toggle"><input id="hear" type="checkbox"> I can hear audio clearly</label><div class="actions"><button class="btn" onclick="context={language:$('language').value,englishYears:$('years').value,hearing:$('hear').checked};go(2)">Continue →</button></div>`)}
else if(stage===2){const t=wordTrials[trial];if(!t){go(3);return}show(heading('Station 01 · Reading','Real or Not?','Decide whether each letter sequence is a real English word. Work at a comfortable pace.')+progress(trial+1,wordTrials.length)+`<span class="pill">${t.level}</span><div class="stimulus">${esc(t.word)}</div>`+options(t.options)+`<button id="continue" class="btn" disabled onclick="submitWord()">Next →</button>`);startTimer()}
else if(stage===3){const t=soundTrials[trial];if(!t){go(4);return}show(heading('Station 02 · Sounds','Sound Lab','Listen to the word, remove the written sound, and choose the spoken answer.')+progress(trial+1,soundTrials.length)+`<span class="pill">${t.level}</span><div class="audio"><button class="btn secondary" onclick="speak('${t.word}')">▶ Play original word</button></div><div class="stimulus" style="font-size:26px">Remove the sound <strong>/${esc(t.remove)}/</strong></div><div class="choices">${t.options.map((v,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="choose(${i});speak('${v}')">▶ Answer ${i+1}</button>`).join('')}</div><button id="continue" class="btn" disabled onclick="submitSound()">Next →</button><p class="foot">Original word and answers are audio-only. Browser speech may mispronounce invented words; recorded audio is recommended.</p>`);startTimer()}
else if(stage===4){const t=spellingTrials[trial];if(!t){go(5);return}show(heading('Station 03 · Writing','Echo','Listen to the word and type what you heard. You can replay the audio.')+progress(trial+1,spellingTrials.length)+`<span class="pill">${t.level}</span><div class="audio"><button class="btn secondary" onclick="speak('${t.word}')">▶ Play word</button></div><div class="field"><label for="spelling">Your spelling</label><input id="spelling" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word here" onkeydown="if(event.key==='Enter')submitSpelling()"></div><button class="btn" onclick="submitSpelling()">Next →</button>`);startTimer()}
else if(stage===5){show(heading('Station 04 · Written expression','Express Your Idea','Write a short response in your own words. This activity looks at grammar, punctuation, clarity, and organization.')+`<div class="field"><label for="writing">Your university is planning a new student study space. Explain what it should include and why (3–5 sentences).</label><textarea id="writing" rows="6" maxlength="1500" placeholder="Write your response here..." spellcheck="false" style="width:100%;padding:14px;border:1px solid #d8e1ef;border-radius:12px;font:inherit;resize:vertical"></textarea></div><button class="btn" onclick="submitWriting()">Continue →</button><p class="foot">Your writing is saved for review; this prototype does not automatically grade it.</p>`);startTimer()}
else if(stage===6){renderPassage()}
else if(stage===7){renderMathNumber()}
else if(stage===8){renderMathReasoning()}
else if(stage===9){const q=mathHistory[trial];if(!q){go(10);return}show(heading('Final step · Learning history','A little about your experience','These questions are optional. Choose “Not sure” if you do not remember.')+progress(trial+1,mathHistory.length)+`<h2 style="font-size:19px;margin-top:25px">${esc(q[1])}</h2>`+options(['No difficulty','A little difficulty','Some difficulty','A lot of difficulty','Not sure / prefer not to say'])+`<button class="btn" id="continue" disabled onclick="submitHistory()">Next →</button>`)}
else if(stage===10){const byGame=['Real or Not?','Sound Lab','Echo','Express Your Idea','Read & Listen','Number Challenge','Math Reasoning'].map(g=>{const a=results.filter(r=>r.game===g&&r.correct!==null);return {g,ok:a.filter(x=>x.correct).length,n:a.length}});show(heading('Journey complete','Your activity summary','This shows what you completed, not whether you have a learning disability.')+`<div class="metrics"><div class="metric"><strong>${results.length}</strong><span>Recorded activities</span></div><div class="metric"><strong>${Object.keys(historyAnswers).length}</strong><span>History responses</span></div><div class="metric"><strong>7</strong><span>Stations explored</span></div></div><div class="choices">${byGame.map(x=>`<div class="choice" style="cursor:default"><strong>${x.g}</strong><span style="float:right;color:#63738a">${x.n?x.ok+'/'+x.n+' correct':'Completed'}</span></div>`).join('')}</div><div class="info">Screening thresholds, profiles and referrals are intentionally not generated from these unvalidated demo items.</div><div class="actions"><button class="btn" onclick="download()">Export session JSON ↓</button><button class="btn ghost" onclick="reset()">Restart</button></div>`)} }
function submitWord(){const t=wordTrials[trial];record('Real or Not?',t.word,t.options[selected],selected===t.answer,{level:t.level});trial++;selected=null;render()}
function submitSound(){const t=soundTrials[trial];record('Sound Lab',t.word,t.options[selected],selected===t.answer,{level:t.level});trial++;selected=null;render()}
function submitSpelling(){const t=spellingTrials[trial],v=$('spelling').value.trim().toLowerCase();if(!v)return;record('Echo',t.word,v,v===t.word,{level:t.level});trial++;render()}
function submitWriting(){const v=$('writing').value.trim();if(!v){alert('Please write a short response.');return}record('Express Your Idea','Study space paragraph',v,null,{characters:v.length,words:v.split(/\s+/).length});go(6)}
function submitRecall(){const v=$('digitsAnswer').value.replace(/\s/g,'');record('Express Your Idea','reverse 7294',v,v==='4927');go(6)}
const passage='A university library introduced a quiet study area after students reported difficulty concentrating in crowded spaces. The new area included individual desks, adjustable lighting, and signs asking visitors to silence their devices. During the first month, staff noticed that the space was popular in the afternoons. However, some students preferred group study rooms because they needed to discuss assignments. The library decided to keep both types of spaces available and gather feedback before making further changes.';
const passageQuestions=[{q:'Why was the quiet area introduced?',opts:['To replace group rooms','To help students concentrate','To store more books'],a:1},{q:'When was the area especially popular?',opts:['In the afternoons','Late at night','Early mornings'],a:0},{q:'What did the library decide?',opts:['Close the quiet area','Ban group study','Keep both types of spaces'],a:2},{q:'Why did some students prefer group rooms?',opts:['They needed to discuss assignments','They wanted brighter lights','They disliked the library'],a:0}];
function renderPassage(){if(!passageDone){show(heading('Station 05 · Comprehension','Read & Listen','Read the passage at your natural pace. When you finish, continue to the questions.')+`<div class="passage" id="passage">${esc(passage)}</div><div class="actions"><button class="btn" onclick="passageDone=true;context.passageReadingMs=Math.round(performance.now()-passageStart);trial=0;render()">I finished reading →</button></div>`);if(!passageStart)passageStart=performance.now();return}const t=passageQuestions[trial];if(!t){go(7);return}show(heading('Station 05 · Comprehension','Reading questions','Answer based on the passage you just read.')+progress(trial+1,passageQuestions.length)+`<h2 style="font-size:19px">${esc(t.q)}</h2>`+options(t.opts)+`<div class="actions"><button class="btn secondary" onclick="lookbacks++;alert(${JSON.stringify(passage)})">Look back at passage</button><button id="continue" class="btn" disabled onclick="submitPassage()">Next →</button></div>`);startTimer()}
function submitPassage(){const t=passageQuestions[trial];record('Read & Listen',t.q,t.opts[selected],selected===t.a,{lookbacks});trial++;selected=null;render()}
function submitHistory(){const q=mathHistory[trial];historyAnswers[q[0]]=['No difficulty','A little difficulty','Some difficulty','A lot of difficulty','Not sure / prefer not to say'][selected];trial++;selected=null;render()}
const numberTasks=[
{q:'Which number is greater?',opts:['47','74','Equal'],a:1,skill:'number_sense'},
{q:'Which number is closest to 50?',opts:['29','48','67'],a:1,skill:'number_sense'},
{q:'What is 7 + 8?',opts:['14','15','16'],a:1,skill:'number_fact'},
{q:'What is 6 × 4?',opts:['20','24','28'],a:1,skill:'number_fact'},
{q:'Calculate: 38 + 27',opts:['55','65','75'],a:1,skill:'calculation'},
{q:'Calculate: 84 − 39',opts:['45','55','43'],a:0,skill:'calculation'}];
const reasoningTasks=[
{q:'A notebook costs 7 AED. How much do 3 notebooks cost?',opts:['10 AED','21 AED','24 AED'],a:1},
{q:'A class has 24 students. They form equal groups of 6. How many groups?',opts:['4','6','18'],a:0},
{q:'A bus leaves at 9:20 and arrives 45 minutes later. When does it arrive?',opts:['9:55','10:05','10:15'],a:1}];
let mathClock=null,mathDeadline=0,mathLocked=false;
function stopMathClock(){if(mathClock!==null){clearInterval(mathClock);mathClock=null}}
function mathLimit(t,reasoning){return reasoning?40:(t.skill==='number_sense'?8:t.skill==='number_fact'?10:25)}
function beginMathClock(seconds,submit){stopMathClock();mathLocked=false;mathDeadline=performance.now()+seconds*1000;const update=()=>{const remaining=Math.max(0,Math.ceil((mathDeadline-performance.now())/1000));const el=$('math-clock');if(el)el.textContent=remaining;if(remaining===0){stopMathClock();if(!mathLocked)submit(true)}};update();mathClock=setInterval(update,100)}
function mathSelect(i,reasoning){if(mathLocked)return;selected=i;if(reasoning)submitMathReasoning(false);else submitMathNumber(false)}
function renderMathNumber(){const t=numberTasks[trial];if(!t){go(8);return}const limit=mathLimit(t,false);show(heading('Station 06 · Mathematics','Number Challenge','Choose your answer before time runs out. The clock starts when the question appears.')+progress(trial+1,numberTasks.length)+`<span class="pill">Time left: <strong id="math-clock">${limit}</strong>s</span><h2>${esc(t.q)}</h2><div class="choices">${t.opts.map((v,i)=>`<button class="choice" onclick="mathSelect(${i},false)">${esc(v)}</button>`).join('')}</div><p class="foot">Your choice submits immediately. Timeouts are recorded separately.</p>`);startTimer();beginMathClock(limit,submitMathNumber)}
function submitMathNumber(timeout=false){if(mathLocked)return;mathLocked=true;stopMathClock();const t=numberTasks[trial];record('Number Challenge',t.q,timeout?null:t.opts[selected],!timeout&&selected===t.a,{skill:t.skill,timeout,time_limit_s:mathLimit(t,false)});trial++;selected=null;render()}
function renderMathReasoning(){const t=reasoningTasks[trial];if(!t){go(9);return}const limit=mathLimit(t,true);show(heading('Station 07 · Mathematics','Math Reasoning','Choose your answer before time runs out.')+progress(trial+1,reasoningTasks.length)+`<span class="pill">Time left: <strong id="math-clock">${limit}</strong>s</span><h2>${esc(t.q)}</h2><div class="choices">${t.opts.map((v,i)=>`<button class="choice" onclick="mathSelect(${i},true)">${esc(v)}</button>`).join('')}</div><p class="foot">Your choice submits immediately. Timeouts are recorded separately.</p>`);startTimer();beginMathClock(limit,submitMathReasoning)}
function submitMathReasoning(timeout=false){if(mathLocked)return;mathLocked=true;stopMathClock();const t=reasoningTasks[trial];record('Math Reasoning',t.q,timeout?null:t.opts[selected],!timeout&&selected===t.a,{timeout,time_limit_s:mathLimit(t,true)});trial++;selected=null;render()}
function download(){const payload={prototype:true,created_at:new Date().toISOString(),context,historyAnswers,results};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lexpace_demo_session.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reset(){stage=0;trial=0;selected=null;results=[];context={};historyAnswers={};passageStart=0;passageDone=false;lookbacks=0;phase=0;render()}
render();
</script></body></html>
